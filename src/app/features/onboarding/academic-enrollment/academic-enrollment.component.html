<ion-content class="bg-slate-50 " style="--background: transparent;">
 <div class="flex flex-col min-h-screen px-6 py-12">
 <!-- Header -->
 <div class="mb-10 text-center animate-fade-in-up">
 <div class="w-16 h-16 mx-auto bg-indigo-100 rounded-2xl flex items-center justify-center mb-4 shadow-inner">
 <svg class="w-8 h-8 text-indigo-600 " fill="none" viewBox="0 0 24 24" stroke="currentColor">
 <path d="M12 14l9-5-9-5-9 5 9 5z" />
 <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
 </svg>
 </div>
 <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Parcours Académique</h1>
 <p class="text-slate-500 mt-2 font-medium">Renseignez vos informations universitaires.</p>
 </div>

 <!-- Error Message -->
 <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl flex items-start animate-fade-in">
 <svg class="w-5 h-5 text-red-500 mt-0.5 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
 </svg>
 <p class="text-sm font-bold text-red-700 ">{{ errorMessage }}</p>
 </div>

 <!-- Form -->
 <form (ngSubmit)="onSubmit()" class="space-y-5 flex-1 animate-fade-in-up" style="animation-delay: 100ms;">
 
 <div>
 <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Niveau d'Étude</label>
 <select [(ngModel)]="enrollmentData.niveauEtude" name="niveauEtude" required (change)="onNiveauChange()"
 class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-900 appearance-none">
 <option value="" disabled selected>Sélectionner un niveau</option>
 <option value="L1_ANNEE">Niveau L1</option>
 <option value="L2_ANNEE">Niveau L2</option>
 <option value="L3_ANNEE">Niveau L3</option>
 <option value="L4_ANNEE">Niveau L4</option>
 <option value="L5_ANNEE">Niveau L5</option>
 </select>
 </div>

 <div *ngIf="filteredDocumentsRequis.length > 0" class="space-y-4 pt-4 border-t border-slate-200 animate-fade-in">
 <h3 class="text-sm font-bold text-slate-900 mb-2">Documents Requis</h3>
 <div *ngFor="let doc of filteredDocumentsRequis; let i = index" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
   <div class="flex items-center justify-between">
     <label class="block text-sm font-bold text-slate-700">
       {{ i + 1 }}. {{ doc.typeDocument.replace('_', ' ') | titlecase }} <span class="text-red-500">*</span>
     </label>
     <span *ngIf="selectedFiles[doc.typeDocument]" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700">Prêt</span>
   </div>
   <p class="text-xs text-slate-500" *ngIf="doc.description">{{ doc.description }}</p>

   <div class="grid grid-cols-2 gap-2.5">
     <label class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs cursor-pointer border border-indigo-200 transition-all text-center">
       <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
       </svg>
       <span>Prendre photo</span>
       <input type="file" [id]="'cam-' + doc.typeDocument" (change)="onFileSelected($event, doc.typeDocument)" accept="image/*" capture="environment" class="hidden">
     </label>

     <label class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer border border-slate-200 transition-all text-center">
       <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
       </svg>
       <span>Fichier / PDF</span>
       <input type="file" [id]="'file-' + doc.typeDocument" (change)="onFileSelected($event, doc.typeDocument)" accept="image/*,application/pdf,.pdf" class="hidden">
     </label>
   </div>

   <div *ngIf="selectedFiles[doc.typeDocument]" class="flex items-center gap-3 p-2.5 bg-slate-50 rounded-lg border border-slate-200/80">
     <img *ngIf="filePreviews[doc.typeDocument]" [src]="filePreviews[doc.typeDocument]" alt="Aperçu" class="w-12 h-12 rounded-lg object-cover border border-slate-200 shrink-0">
     <div *ngIf="!filePreviews[doc.typeDocument]" class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center font-bold text-xs shrink-0">PDF</div>
     <div class="min-w-0 flex-1">
       <p class="text-xs font-bold text-slate-800 truncate">{{ selectedFiles[doc.typeDocument].name }}</p>
       <p class="text-[11px] text-emerald-600 font-semibold">Document enregistré</p>
     </div>
   </div>
 </div>
 </div>

 <div class="pt-6">
 <button type="submit" [disabled]="isSubmitting" 
 class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-[0.98] disabled:opacity-70 flex justify-center items-center">
 <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
 <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
 <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
 </svg>
 <span *ngIf="!isSubmitting">Continuer</span>
 <span *ngIf="isSubmitting">Vérification en cours...</span>
 </button>
 </div>

 </form>
 
 <div class="mt-6">
 <!-- Progress Indicator -->
 <div class="flex justify-center space-x-2">
 <div class="w-8 h-2 bg-indigo-600 rounded-full"></div>
 <div class="w-8 h-2 bg-indigo-600 rounded-full"></div>
 <div class="w-8 h-2 bg-slate-200 rounded-full"></div>
 </div>
 </div>
 </div>
</ion-content>
